<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" role="img" aria-labelledby="journey-title journey-desc">
<title id="journey-title">Zero Trust MVP: eight customer journey stages</title>
<desc id="journey-desc">Prepare source, describe and submit, four separate reviews, author publication, configure and run, output privacy decision, download accepted sample, trace and iterate. The sequence reads left to right on the first row and right to left on the second row. Click a phase to read its screenshots and customer context.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8c91a4"/></marker></defs>
<path d="M300 96H332" fill="none" stroke="#8c91a4" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M620 96H652" fill="none" stroke="#8c91a4" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M940 96H972" fill="none" stroke="#8c91a4" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1120 175V242" fill="none" stroke="#8c91a4" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M980 326H948" fill="none" stroke="#8c91a4" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M660 326H628" fill="none" stroke="#8c91a4" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M340 326H308" fill="none" stroke="#8c91a4" stroke-width="2" marker-end="url(#arrow)"/>
