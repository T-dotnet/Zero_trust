<a href="#J02" aria-label="J02 Describe and submit the method"><g><rect x="340" y="20" width="280" height="155" rx="8" fill="#f6f7fa" stroke="#e0e4ec"/><text x="360" y="50" font-family="Arial,sans-serif" font-size="16" fill="#006b50">02 / J02</text><text x="360" y="85" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#18212f">Describe &amp; submit</text><text x="360" y="154" font-family="Arial,sans-serif" font-size="17" fill="#626a7e">Researcher</text></g></a>
<a href="#J03" aria-label="J03 Complete organizational review"><g><rect x="660" y="20" width="280" height="155" rx="8" fill="#eafbf5" stroke="#a1e7d2"/><text x="680" y="50" font-family="Arial,sans-serif" font-size="16" fill="#006b50">03 / J03</text><text x="680" y="85" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#18212f">Four separate reviews</text><text x="680" y="154" font-family="Arial,sans-serif" font-size="17" fill="#626a7e">Review team</text></g></a>
<a href="#J04" aria-label="J04 Publish the reviewed version"><g><rect x="980" y="20" width="280" height="155" rx="8" fill="#f6f7fa" stroke="#e0e4ec"/><text x="1000" y="50" font-family="Arial,sans-serif" font-size="16" fill="#006b50">04 / J04</text><text x="1000" y="85" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#18212f">Author publication</text><text x="1000" y="154" font-family="Arial,sans-serif" font-size="17" fill="#626a7e">Researcher</text></g></a>
<a href="#J05" aria-label="J05 Run the approved method"><g><rect x="980" y="250" width="280" height="155" rx="8" fill="#f6f7fa" stroke="#e0e4ec"/><text x="1000" y="280" font-family="Arial,sans-serif" font-size="16" fill="#006b50">05 / J05</text><text x="1000" y="315" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#18212f">Configure &amp; run</text><text x="1000" y="384" font-family="Arial,sans-serif" font-size="17" fill="#626a7e">Researcher + demo system</text></g></a>
<a href="#J06" aria-label="J06 Validate the generated output"><g><rect x="660" y="250" width="280" height="155" rx="8" fill="#eafbf5" stroke="#a1e7d2"/><text x="680" y="280" font-family="Arial,sans-serif" font-size="16" fill="#006b50">06 / J06</text><text x="680" y="315" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#18212f">Output privacy</text><text x="680" y="342" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#18212f">decision</text><text x="680" y="384" font-family="Arial,sans-serif" font-size="17" fill="#626a7e">Privacy reviewer</text></g></a>
<a href="#J07" aria-label="J07 Retrieve the accepted sample"><g><rect x="340" y="250" width="280" height="155" rx="8" fill="#f6f7fa" stroke="#e0e4ec"/><text x="360" y="280" font-family="Arial,sans-serif" font-size="16" fill="#006b50">07 / J07</text><text x="360" y="315" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#18212f">Download accepted</text><text x="360" y="342" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#18212f">sample</text><text x="360" y="384" font-family="Arial,sans-serif" font-size="17" fill="#626a7e">Researcher</text></g></a>
<a href="#J08" aria-label="J08 Trace decisions and improve the method"><g><rect x="20" y="250" width="280" height="155" rx="8" fill="#f6f7fa" stroke="#e0e4ec"/><text x="40" y="280" font-family="Arial,sans-serif" font-size="16" fill="#006b50">08 / J08</text><text x="40" y="315" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#18212f">Trace &amp; iterate</text><text x="40" y="384" font-family="Arial,sans-serif" font-size="17" fill="#626a7e">Researcher / all participants</text></g></a>
</svg>
